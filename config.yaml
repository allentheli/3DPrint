# Charm Maker configuration. Every size, tolerance and filament lives here.
# All lengths are millimetres unless the key says otherwise.
#
# Values under `fit:` are fit-critical. They start as guesses and are replaced by
# the milestone 0 fit-test results. Do not trust a value whose `tested` is false.

printer:
  name: Bambu Lab X2D with AMS
  # Usable plate size. Checked against the Bambu documentation before milestone 2.
  bed_size: [256, 256]
  ams_slots: 4                    # one AMS
  max_filaments_per_plate: 4      # one AMS
  layer_height_charms: 0.12       # charms, figures, earrings, pendants, keycaps
  layer_height_cases: 0.20        # clicker cases and figure stands
  nozzle: 0.4

# Spools Allen owns. Fill in once. `color` is a hex code close to the real
# filament color. Used to suggest a spool when a drawing needs a color that
# isn't loaded.
filaments: []
# Example:
#  - {name: "White PLA", color: "#F2F2F2"}
#  - {name: "Orange PLA", color: "#F77F00"}

# Which spool is in which AMS slot right now. The kids' palette is exactly these
# colors. Allen says swaps in plain words ("pink is in slot 3 now"); Claude runs
# `python -m charm_maker load 3 "Pink PLA" --color "#EC4899"`. `marker` is the
# photographed color of the matching marker, written by the calibration card scan
# and cleared when the spool in that slot changes.
loaded: {}
# Example:
#  1: {spool: "White PLA", color: "#F2F2F2"}
#  3: {spool: "Pink PLA", color: "#EC4899", marker: "#E0508C", calibrated: "2026-11-09"}

# Matching kid ink to the loaded colors.
palette:
  # Only used with --ask-colors (the strict mode): stop and ask about colors that
  # aren't loaded and about an unscanned calibration card.
  off_palette_distance: 25        # ink farther than this from every calibrated marker is not loaded
  off_palette_distance_uncalibrated: 35   # same, while matching against spool colors only
  off_palette_min_area_mm2: 3.0   # smaller patches are camera fringe, not a drawn color
  lightness_weight: 0.3           # streaky or pale fill changes lightness and chroma, not hue
  chroma_weight: 0.5
  calibration_min_coverage: 0.3   # a calibration box needs this much ink to count

# Filament chips: one per loaded filament, printed live as the kids' printer tour.
chips:
  width: 26
  length: 18
  thickness: 1.2
  corner_radius: 3
  number_height: 9
  number_stroke: 1.6
  number_depth: 0.6               # slot number cut into the top face
  gap: 15                         # roomy, for Print sequence: By object
  layer_height: 0.20
  budget_minutes: 15
  # Rough time model (not the slicer): start-up, effective flow, one AMS swap.
  estimate_startup_minutes: 5.0
  estimate_flow_mm3_per_s: 8.0
  estimate_swap_minutes: 1.5

# Image to print pipeline settings.
process:
  card_scale: 3                   # drawing box is 3x the product's real size
  color_face_depth: 0.6           # front layers that hold the colors, flush
  border: 1.5                     # die-cut style border in the base color
  border_default: true            # on for everyone; --no-border turns it off for a run
  min_ink_width: 1.0              # thinner ink gets thickened to this
  min_gap: 0.4                    # ...but separate marks (eyes next to a mouth) never grow closer than this
  thin_strip_min_area: 0.3        # mm²: a separate thin strip of color this big (a straw colored in) is kept; lines thicken around it
  rejoin_max_length: 2.0          # mm: a faint trace of a color joins two pieces of it this far apart at most
  rejoin_width: 0.5               # mm: how wide the join is made, so it prints
  min_speck_area_mm2: 1.0         # smaller specks are removed...
  speck_max_extent: 1.5           # ...unless they are this long (a thin smile is not a speck)
  coloring_gap: 0.5               # paper gaps narrower than this inside a color get filled
  min_outer_feature: 2.0          # outer bits thinner than this are smoothed into the border
  corner_round: 0.5
  base_color: white               # "white" or "kid_color"
  # Colors: every distinct ink color becomes its own named part, so Bambu Studio
  # shows the separation; Allen assigns spools there. Matching to loaded spools is
  # only a head start.
  max_ink_colors: 3               # plus the white base = one AMS; extra colors merge into the nearest
  color_merge_distance: 20        # inks closer than this are one color (hue-weighted Lab)
  min_color_area_mm2: 3.0         # smaller patches are camera fringe, not a color

# Fit-critical values. Each has a `value` (used by the pipeline), `tested`
# (true once set from a real print) and the `candidates` printed on the fit-test
# plate, in piece-number order. `python -m charm_maker fit-results` writes them.
fit:
  clip_pocket_diameter:
    value: 11.2
    tested: true   # 2026-11-11
    candidates: [11.2, 11.5, 11.8]
    note: round pocket on the back of a hair clip charm for the clip's 11 mm pad
  keyring_hole_diameter:
    value: 4.5
    tested: true   # 2026-11-11
    candidates: [4.5, 5.0, 5.5]
    note: hole in a keychain's ring tab for a 25 mm split ring
  earring_hole_diameter:
    value: 1.5
    tested: false
    candidates: [1.3, 1.5, 1.8]
    note: front-to-back hole in the earring's small top tab; a 4 mm jump ring goes through it (Allen, 2026-11-11)
  switch_cutout:
    value: 13.9
    tested: true   # 2026-11-11
    candidates: [13.9, 14.0, 14.1]
    note: square cutout in the 1.5 mm clicker top plate for an MX-style switch
  stem_socket_clearance:
    value: 0.1
    tested: true   # 2026-11-11
    candidates: [0.10, 0.15, 0.20]     # centered on the common printed-clicker default (0.15, 0.05 steps)
    note: added to each arm width of the keycap's cross socket for the MX stem
  necklace_hole_diameter:
    value: 3.5
    tested: true   # 2026-11-11
    candidates: [3.0, 3.5, 4.0]
    note: sideways hole (left to right) in the pendant's top loop; the chain goes straight through

# Hardware sizes that are not tolerances (measured or from the manufacturer).
hardware:
  clip_pad_diameter: 11.0
  clip_pocket_depth: 0.6
  clip_pocket_min_wall: 1.5
  clip_min_circle: 13.0           # if no circle this big fits, grow the border or add a backer
  clip_backer_diameter: 14.0
  magnet_diameter: 10.0
  magnet_thickness: 2.0
  magnet_height_above_bottom: 12.0  # glue the magnet about here so figures line up with the stand
  keyring_hole_min_wall: 2.5
  # Side loops for pendants and earrings: a loop on top with a hole running left to
  # right, so the piece hangs facing forward. The loop sits flush with the front face
  # and stands taller than the charm on the back.
  jump_ring_diameter: 4.0         # Allen's earring jump rings (outside); about 2.5 mm inside
  earring_tab_wall: 1.0           # plastic around the earring's hole: thin, so the jump ring closes around it
  necklace_loop: {wall: 1.2, length: 7.0}
  loop_overlap: 2.0               # how far the loop reaches into the charm
  loop_gap: 0.8                   # plastic between the hole and the charm's top edge
  washer_diameter: 25.4           # 1 inch zinc-plated steel fender washer
  washer_thickness: 1.6
  mx_stem_span: 4.1               # length of each arm of the plus-shaped stem
  mx_stem_arm_x: 1.17             # width of the arm that runs left-right
  mx_stem_arm_y: 1.31             # width of the arm that runs front-back
  mx_stem_height: 3.6
  mx_keycap_post_diameter: 5.5     # round post around the keycap's cross socket (standard keycaps)
  mx_plate_thickness: 1.5
  mx_cavity_size: 15.6            # closed cavity under the plate, square
  mx_cavity_depth: 9.0
  mx_full_travel: 4.0
  mx_stem_top_above_plate: 11.6   # top of the stem at rest (secondary sources; no official MX drawing)
  mx_housing_above_plate: 7.0     # top of the switch housing; sources say 6.6 to 7, taken high to be safe

# Products. Flat products share the same pipeline; `attachment` picks the extra
# feature. New flat products can be added here without new code.
products:
  hair_clip:
    label: Hair clip charm
    file_word: clip
    size_min: 14
    size_max: 25
    default_size: 22
    thickness: 2.4
    attachment: clip_pocket
    copies: 1
    card: hair_clip
  keychain:
    label: Keychain
    file_word: keychain              # files are named keychain-jack after the kid
    size_min: 35
    size_max: 55
    default_size: 45
    thickness: 3.2
    attachment: ring_tab
    tab_position: top             # top, top-left, top-right, left, right
    copies: 1
    card: keychain
  clicker:
    label: Clicker keychain
    file_word: clicker
    size_min: 16                  # the keycap covers the switch at least
    size_max: 40                  # Allen: no tight limit; bigger keycaps wobble more on one switch
    default_size: 19
    thickness: 2.4                # keycap top plate; the socket boss sits behind it
    attachment: stem_socket
    glue_on_fallback: false       # true makes a flat charm for a store-bought blank keycap
    post_height: 4.5              # the round post behind the keycap (hardware.mx_keycap_post_diameter)
    socket_depth: 4.0             # the cross socket in the post, open at the post's end
    post_margin: 0.8              # drawing around the post, at least
    case_wall: 1.6
    case_floor: 1.2
    case_corner_radius: 3.0
    case_margin: 1.0              # the case is the drawing's outline, this much bigger all round
    case_smooth: 1.5              # notches and thin bits narrower than about twice this are smoothed over
    case_pushout_hole: 6.0        # a pen through the floor pushes the switch back out
    ring_post_length: 6.0         # the ring post at the top: the hole runs left to right through it,
    ring_post_gap: 0.8            # at half height; plastic between the hole and the case
    copies: 1
    card: clicker
  magnet_figure:
    label: Magnet figure
    file_word: magnet
    size_min: 30
    size_max: 55
    default_size: 45
    thickness: 3.2
    attachment: flat_back         # the magnet is glued onto the flat back
    copies: 1
    card: magnet_figure
  earrings:
    label: Earrings (a pair)
    file_word: earrings
    adults_only: true
    size_min: 15
    size_max: 35
    default_size: 25
    thickness: 1.8
    attachment: jump_ring_tab     # Allen: a 4 mm jump ring through a small hole near the top, the hook on the ring
    style: hook                   # hook (jump ring tab) or stud (flat back, no tab)
    pair_mode: mirrored           # Allen: the second earring is the mirror image (or identical)
    copies: 2
    card: earrings
  pendant:
    label: Necklace pendant
    file_word: necklace
    size_min: 25
    size_max: 45
    default_size: 35
    thickness: 2.6
    attachment: side_loop
    loop: necklace                # hardware.necklace_loop, fit.necklace_hole_diameter
    copies: 1
    card: pendant

# Shape styles. "flat" is the default (face-down, colors flush on the smooth bed side).
# The others print face-up with the colors on top:
#   puffy           the piece swells into a pillow, highest in the middle
#   outlined        flat, with the dark outline raised as a rounded ridge
#   puffy-outlined  both
relief:
  default_style: flat
  edge_round: 4.0                 # how far in from the edge the puff takes to reach full height
  outline_raise: 0.6              # height of the raised outline ridge
  outline_round: 0.5              # rounded shoulders on the ridge (less snagging, less snapping)
  outline_max_lightness: 50       # only an ink this dark counts as the outline
  outline_max_line_width: 2.5     # a one-color drawing's ink is its outline if its strokes are this thin or thinner (mm)
  sample: 0.4                     # mesh resolution for curved surfaces
  products:                       # base slab and puff height per product, for puffy styles
    hair_clip: {base: 1.2, puff: 1.2}
    keychain: {base: 2.4, puff: 2.0}
    pendant: {base: 1.8, puff: 1.8}
    earrings: {base: 1.0, puff: 1.0}
    magnet_figure: {base: 2.0, puff: 2.0}
    clicker: {base: 1.6, puff: 1.2}

# Poop jars: see-through mesh jars with a screw lid that kids fill with printer
# poop (purge waste) themselves and take home. Printed upright, lid upside down,
# no supports: the mesh holes are diamonds (45 degree roofs) and the thread is a
# smooth two-start helix that closes in one turn.
poop_jar:
  wall: 1.8
  floor: 1.6
  hole: 4.0                       # diamond hole, corner to corner (width and height)
  strut: 1.4                      # plastic between holes
  bottom_band: 6.0                # solid band above the floor
  top_band: 3.0                   # solid band between the mesh and the thread
  thread_height: 10.0
  thread_lead: 10.0               # one full turn closes the lid
  thread_amplitude: 0.7           # ridge stands 2x this proud of the neck
  thread_clearance: 0.4           # fit-critical: try the first lid before printing a batch
  lid_wall: 2.0
  lid_top: 2.0
  lid_ribs: 30
  shoulder_slope: 1.0             # hex jars: run/rise of the shoulder (1.0 = 45 degrees)
  sizes:                          # diameter = outside of a round jar, across the flats of a hex jar
    small: {diameter: 40, height: 45}
    medium: {diameter: 50, height: 60}
    tall: {diameter: 40, height: 80}
  layer_height: 0.20
  estimate_flow_mm3_per_s: 8.0
  estimate_mesh_factor: 1.8       # mesh walls mean lots of short moves

poop_critters:
  duck:
    scale: {small: 0.85, medium: 1.0, tall: 1.0}
  outline_scale: 1.35             # heart, star and cloud jars: width = size diameter x this

# Figurines: a drawing inflated into a rounded 3D figure (style "figurine", any card).
figurine:
  back: flat                      # flat: only the front is rounded, the card's product (clip pad, magnet,
                                  # ring, loop) still works, no supports. Round backs make a standalone
                                  # figure: blank (characters) or mirror (patterns: the front shows through)
  flat_back_max_dome: {hair_clip: 5.0, keychain: 8.0, pendant: 6.0, earrings: 4.0, magnet_figure: 10.0, clicker: 4.0}
                                  # tallest the rounded front may stand above the base slab, mm
  # Round-back figurines only:
  size: 60                        # longest side, mm
  base: flat                      # flat (bottom cut so it stands), disc (a round base) or none
  roundness: 0.75                 # 1.0 = round cross-sections, lower = flatter
  edge_half_thickness: 0.8        # so thin edges still print
  smoothing_px: 1.2
  flat_bottom: 0.08               # flat cut, as a share of the height
  disc_radius: 0.35               # round base radius, as a share of the width
  disc_thickness: 3.0
  sample: 0.5                     # mesh resolution
  layer_height: 0.16

# Tidy (off unless asked for, per card): the outline color's strokes redrawn along their
# middle at one even thickness, wobbly and grainy edges smoothed; dots, blobs and
# colored-in areas keep their shape, and other colors only get smooth edges.
tidy:
  line_width: auto                # auto: the drawing's typical stroke width; or a number in mm
  max_line_width: 1.6             # auto never goes thicker than this
  fill_min_width: 3.0             # ink wider than this is a colored-in area, not a stroke
  smooth: 0.15                    # mm: grain and wobble smaller than this are smoothed away

# The universal figure stand (one design, no drawing).
stand:
  base_width: 44
  base_depth: 34
  base_thickness: 3.0
  base_corner_radius: 4.0
  upright_width: 36
  upright_height: 34              # above the base, measured along the tilted face
  upright_thickness: 2.6
  upright_tilt_deg: 10            # leans backward
  upright_from_back_edge: 8.0
  front_wall: 0.6                 # plastic between the magnet and the washer
  washer_recess_clearance: 0.4    # added to the washer diameter
  washer_recess_depth: 2.0
  lip_gap: 4.5                    # room for the figure's bottom in front of the upright
  lip_thickness: 2.0
  lip_height: 1.5

# Fit-test plate (milestone 0) coupon sizes. Not fit-critical.
fit_test:
  gap: 5.0                        # space between pieces
  label_height: 4.0
  label_stroke: 0.8
  label_raise: 0.4
  coupon_corner_radius: 2.0
  clip_coupon: [17, 26, 2.4]      # width, length, thickness
  keyring_coupon: [12, 22, 3.2]
  switch_coupon: [22, 32, 1.5]    # width, length, lid thickness; the box part is width x width
  switch_housing_floor: 1.2       # the switch housings are closed boxes like the clicker case...
  switch_pushout_hole: 6.0        # ...with a hole in the floor to push the switch back out
  stem_coupon: [16, 26, 2.4]
  earring_tab_coupon: [10, 12, 1.8]
  necklace_loop_coupon: [12, 18, 2.6]
  stem_boss_height: 4.5
  stem_span_clearance: 0.1         # added to the cross length (the arm widths get the tested clearance)
  stem_socket_depth: 4.0

# Design cards (the printable PDF). Lengths in mm on the card.
cards:
  page_size: [215.9, 279.4]       # US Letter
  margin: 10
  marker_size: 20
  marker_dictionary: DICT_5X5_1000
  guide_color: "#B9E4F5"          # very light cyan: far from yellow, removed by the reader
  guide_line_width: 0.5
  name_box: [52, 60, 110, 12]     # x, y, width, height (y from the page bottom)
  copies_per_type: 10             # blank cards numbered 01..N per product
  half_drawn_shapes: [cloud, heart, cat, star, bow]
  half_drawn_first_number: 11     # half-drawn cards are 11, 12... so they never clash with blanks
  half_drawn_copies: 2            # of each shape
  half_drawn_line: 4.5            # card mm, like a fat marker (1.5 mm on the print)
  # Marker type ids. Never renumber: printed cards must keep reading correctly.
  type_ids:
    hair_clip: 0
    keychain: 1
    clicker: 2
    magnet_figure: 3
    earrings: 4
    pendant: 5
    calibration: 7

# Photo reader and ink separation.
reader:
  px_per_card_mm: 6               # rectified page resolution (18 px per real mm)
  box_margin: 3                   # read this far outside the drawing box (card mm)
  edge_band: 1.5                  # ignore this band along the box edge (card mm)
  ink_value_max: 0.60             # darker than this is ink
  ink_saturation_min: 0.40        # more colorful than this is ink
  faint_chroma_min: 10            # a faint pen line counts as ink if it is this colorful...
  faint_delta_min: 18             # ...and this different from the paper (Lab); gray shadows do not
  pencil_line_delta: 20           # a gray stroke is pencil if its core is this much darker than the paper around it...
  pencil_edge_delta: 10           # ...and it grows along its grainy edges down to this
  pencil_chroma_max: 12           # gray, not a colored pen
  pencil_line_width: 2.5          # card mm: wider dark areas (shadows) are not lines
  pencil_min_length: 1.5          # card mm: shorter bits are paper grain
  halo_delta_min: 8               # soft edges of a line: this different from paper and next to ink
  halo_px: 2
  min_blob_px: 6                  # smaller isolated dots are camera noise
  guide_zone_margin: 2.0          # guide-colored ink is only removed this close to a printed guide (card mm)
  black_saturation_max: 0.35      # ink this gray is black
  black_value_max: 0.55
  guide_hue: 197                  # hue of the guide color, degrees
  guide_hue_tolerance: 25
  guide_saturation_max: 0.45      # pale pixels near the guide hue are guides, not ink
  option_mark_min: 0.08           # a tick box counts as ticked when this much of its inside is marked
  hue_merge_deg: 30               # hues closer than this are one color
  min_color_fraction: 0.03        # a color with fewer pixels than this share is merged away

preview:
  dpi: 300
  zoom: 4
  bed_margin: 8                   # keep pieces this far from the plate edge
  piece_gap: 6                    # space between pieces on a plate
